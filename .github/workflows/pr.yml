name: PR verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: calendarik-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify migration guard and versioning
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Lint and JVM tests (no APK)
        run: gradle --no-daemon lintDebug testDebugUnitTest
      - name: Build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

