name: Firestore security rules
on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - package.json
      - scripts/test_firestore_rules.mjs
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated security testing packages
        run: npm install --no-audit --no-fund
      - name: Test access control with Firestore emulator
        run: npm run test:rules
