name: Main APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendarik-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.CALENDARIK_KEYSTORE_BASE64 }}
      CALENDARIK_STORE_PASSWORD: ${{ secrets.CALENDARIK_STORE_PASSWORD }}
      CALENDARIK_KEY_ALIAS: ${{ secrets.CALENDARIK_KEY_ALIAS }}
      CALENDARIK_KEY_PASSWORD: ${{ secrets.CALENDARIK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Set rolling version using Moscow date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.name' 2>/dev/null || true)"
          echo "VERSION_NAME=$(python3 scripts/moscow_version.py "$PREVIOUS")" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Detect private signing configuration
        id: signing
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$CALENDARIK_STORE_PASSWORD" ] && [ -n "$CALENDARIK_KEY_ALIAS" ] && [ -n "$CALENDARIK_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/calendarik-release.p12"
            echo "CALENDARIK_KEYSTORE_FILE=$RUNNER_TEMP/calendarik-release.p12" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release key configured. A debug APK will be built; it uses an ephemeral signing identity and MUST NOT be used for permanent data."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build preview APK without signing secrets
        if: steps.signing.outputs.enabled != 'true'
        run: gradle --no-daemon assembleDebug -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"
      - name: Upload non-updatable preview APK
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calendarik-ephemeral-preview-do-not-keep-data
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Build consistently signed release
        if: steps.signing.outputs.enabled == 'true'
        run: |
          gradle --no-daemon assembleRelease -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk Calendarik.apk
          SHA256="$(sha256sum Calendarik.apk | cut -d ' ' -f1)"
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}\n' "$VERSION_CODE" "$VERSION_NAME" "$SHA256" > update.json
      - name: Upload signed release artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calendarik-signed-apk
          path: |
            Calendarik.apk
            update.json
          retention-days: 14
      - name: Point latest tag at this commit
        if: steps.signing.outputs.enabled == 'true'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
      - name: Publish rolling release
        if: steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Calendarik ${{ env.VERSION_NAME }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          body: |
            Signed Calendarik APK. Retains data on upgrades signed with the same key.
            versionCode: ${{ env.VERSION_CODE }}
            versionName: ${{ env.VERSION_NAME }}
            Commit: ${{ github.sha }}
          files: |
            Calendarik.apk
            update.json

