name: Main APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendarik-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.CALENDARIK_KEYSTORE_BASE64 }}
      CALENDARIK_STORE_PASSWORD: ${{ secrets.CALENDARIK_STORE_PASSWORD }}
      CALENDARIK_KEY_ALIAS: ${{ secrets.CALENDARIK_KEY_ALIAS }}
      CALENDARIK_KEY_PASSWORD: ${{ secrets.CALENDARIK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-cleanup: on-success
      - name: Set rolling version using Moscow date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.name' 2>/dev/null || true)"
          echo "VERSION_NAME=$(python3 scripts/moscow_version.py "$PREVIOUS")" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Require stable signing configuration
        run: |
          test -n "$KEYSTORE_B64" && test -n "$CALENDARIK_STORE_PASSWORD" && test -n "$CALENDARIK_KEY_ALIAS" && test -n "$CALENDARIK_KEY_PASSWORD" || { echo "Release signing secrets are required" >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/calendarik-release.p12"
          echo "CALENDARIK_KEYSTORE_FILE=$RUNNER_TEMP/calendarik-release.p12" >> "$GITHUB_ENV"
      - name: Verify migration and release policies
        run: |
          python3 scripts/check_migration_policy.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate keystore before release build
        run: |
          test -s "$CALENDARIK_KEYSTORE_FILE"
          # Confirm the store can be read. Never print the private key or passwords.
          keytool -list -keystore "$CALENDARIK_KEYSTORE_FILE" \
            -storetype PKCS12 -storepass "$CALENDARIK_STORE_PASSWORD" >/dev/null
          # Some keystores have a different alias from the configured secret.
          # Only auto-select when there is EXACTLY ONE actual private key.
          if ! keytool -list -v -alias "$CALENDARIK_KEY_ALIAS" \
              -keystore "$CALENDARIK_KEYSTORE_FILE" -storetype PKCS12 \
              -storepass "$CALENDARIK_STORE_PASSWORD" 2>/dev/null \
              | grep -q 'Entry type: PrivateKeyEntry'; then
            mapfile -t PRIVATE_ALIASES < <(
              keytool -list -v -keystore "$CALENDARIK_KEYSTORE_FILE" \
                -storetype PKCS12 -storepass "$CALENDARIK_STORE_PASSWORD" |
                awk '/^Alias name: / { alias = substr($0, 13) }
                     /^Entry type: PrivateKeyEntry/ { print alias }'
            )
            if [ "${#PRIVATE_ALIASES[@]}" -ne 1 ]; then
              echo "Configured alias is missing or not a private key, and keystore does not have exactly one private-key alias." >&2
              exit 1
            fi
            echo "Configured alias mismatch; using the keystore's only private-key alias."
            echo "CALENDARIK_KEY_ALIAS=${PRIVATE_ALIASES[0]}" >> "$GITHUB_ENV"
          fi
      - name: Verify actual private-key password before release build
        run: |
          if java scripts/VerifySigningKey.java "$CALENDARIK_KEYSTORE_FILE" "$CALENDARIK_KEY_ALIAS" >/dev/null 2>&1; then
            echo "Private-key password verified."
          elif CALENDARIK_KEY_PASSWORD="$CALENDARIK_STORE_PASSWORD" \
              java scripts/VerifySigningKey.java "$CALENDARIK_KEYSTORE_FILE" "$CALENDARIK_KEY_ALIAS" >/dev/null 2>&1; then
            # A PKCS#12 private key normally uses the same password as its store.
            echo "CALENDARIK_KEY_PASSWORD=$CALENDARIK_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Using PKCS#12 store password as the private-key password."
          else
            echo "Signing key cannot be read using either configured key password or store password." >&2
            echo "Correct GitHub Actions secret CALENDARIK_KEY_PASSWORD; do not publish passwords." >&2
            exit 1
          fi
      - name: Lint and JVM tests
        run: bash gradlew --no-daemon lintDebug testDebugUnitTest
      - name: Build consistently signed release
        run: |
          bash gradlew --no-daemon assembleRelease \
            -POPTIMIZE_RELEASE=true \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk Calendarik.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs Calendarik.apk | grep -F "$(sed -n 's/^SIGNING_CERTIFICATE_SHA256=//p' build-identity.properties)"
      - name: Verify publication order and prepare pinned update manifest
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || { echo "A newer main commit exists; publish that build instead" >&2; exit 1; }
          curl --fail --location --retry 3 https://github.com/rteats/calendarik/releases/download/latest/update.json -o previous-update.json
          python3 scripts/release_manifest.py "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_SHA"
          echo "RELEASE_TAG=$(python3 -c 'import json; print(json.load(open("update.json"))["apkUrl"].split("/")[-2])')" >> "$GITHUB_ENV"
      - name: Report APK size compared with previous release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CURRENT_BYTES="$(stat -c%s Calendarik.apk)"
          PREVIOUS_BYTES="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" \
            --jq '.assets[] | select(.name == "Calendarik.apk") | .size' 2>/dev/null | head -n 1 || true)"
          {
            echo "## Signed APK size"
            echo
            echo "- New: $(numfmt --to=iec-i --suffix=B "$CURRENT_BYTES") ($CURRENT_BYTES bytes)"
            if [[ "$PREVIOUS_BYTES" =~ ^[0-9]+$ ]] && [ "$PREVIOUS_BYTES" -gt 0 ]; then
              DELTA_BYTES=$((CURRENT_BYTES - PREVIOUS_BYTES))
              DELTA_PERCENT="$(awk -v d="$DELTA_BYTES" -v p="$PREVIOUS_BYTES" 'BEGIN { printf "%.1f", 100*d/p }')"
              echo "- Previous: $(numfmt --to=iec-i --suffix=B "$PREVIOUS_BYTES") ($PREVIOUS_BYTES bytes)"
              echo "- Difference: $DELTA_BYTES bytes ($DELTA_PERCENT%)"
            else
              echo "- Previous APK: not available for comparison"
            fi
            echo "- Optimization: R8 code shrinking + Android resource shrinking"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK bytes: $CURRENT_BYTES"
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendarik-signed-apk
          path: |
            Calendarik.apk
            update.json
            app/schemas/
          retention-days: 14
      - name: Publish permanent APK for this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Calendarik ${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})
          make_latest: false
          files: |
            Calendarik.apk
            update.json
      - name: Point latest tag at this commit
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Calendarik ${{ env.VERSION_NAME }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          body: |
            Signed Calendarik APK. Retains data on upgrades signed with the same key.
            versionCode: ${{ env.VERSION_CODE }}
            versionName: ${{ env.VERSION_NAME }}
            Commit: ${{ github.sha }}
          files: |
            Calendarik.apk
            update.json

      - name: Save build failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-build-failure-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
